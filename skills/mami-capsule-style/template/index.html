<!doctype html>
<meta charset="utf-8">
<title>my-style</title>
<!--
  Mami 胶囊样式模板。从这里改起：外观随便换，但保留
    1. 透明背景（html/body 不要有底色），
    2. 每种状态都有出口（recording 要有取消/完成，text 要有关闭，copy/retry/undo 为真时给对应按钮），
    3. 能点的东西加 data-mami-hit（别处的点击会穿透到下面的窗口）。
  接口见 SKILL.md。浏览器里直接打开本文件会自动播假数据（mami-sim.js）。
-->
<style>
  :root { --bg: rgba(20, 20, 26, .92); --fg: #f2f2f5; --btn: rgba(255, 255, 255, .12); --accent: #6aa8ff; }
  body.light { --bg: rgba(255, 255, 255, .96); --fg: #1d1d22; --btn: rgba(0, 0, 0, .07); --accent: #3a6df0; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.3 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }

  .pill { position: absolute; left: 50%; bottom: 10px; height: 40px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 0 6px; box-sizing: border-box; border-radius: 20px;
    background: var(--bg); color: var(--fg); box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    transition: opacity .2s, transform .25s; }
  body.hidden .pill { opacity: 0; transform: translateX(-50%) translateY(12px) scale(.94); }

  .btn { flex: none; width: 28px; height: 28px; border-radius: 14px; border: 0; padding: 0; cursor: pointer;
    background: var(--btn); color: inherit; font-size: 13px; display: none; place-items: center; }
  .btn:hover { filter: brightness(1.4); }

  .bars { display: none; align-items: center; gap: 3px; height: 24px; padding: 0 8px; }
  .bars i { width: 3px; border-radius: 2px; background: var(--accent); height: 4px; transition: height .06s linear; }
  .dots { display: none; gap: 4px; padding: 0 12px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--fg); opacity: .3; animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 50% { opacity: 1; } }
  .text { display: none; max-width: 220px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  body.recording .bars, body.recognizing .dots, body.text .text, body.recording.live .text { display: flex; }
  body.recording #cancel, body.recording #stop, body.recognizing #cancel, body.text #close { display: grid; }
  body.copy #copy, body.retry #retry, body.undo #undo { display: grid; }
</style>

<div class="pill" data-mami-hit>
  <button class="btn" id="cancel" title="取消">✕</button>
  <button class="btn" id="close" title="关闭">✕</button>
  <div class="bars" id="bars"></div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="text" id="text"></div>
  <button class="btn" id="stop" title="完成">✓</button>
  <button class="btn" id="copy" title="复制">⧉</button>
  <button class="btn" id="retry" title="重试">↻</button>
  <button class="btn" id="undo" title="撤销">↺</button>
</div>

<script src="mami-sim.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  for (const a of ["cancel", "stop", "close", "copy", "retry", "undo"]) $(a).onclick = () => mami.action(a);

  const bars = Array.from({ length: 12 }, () => $("bars").appendChild(document.createElement("i")));

  mami.onState((s) => {
    const dark = s.tone === "dark" || (s.tone === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.body.className = [s.kind, dark ? "" : "light", s.copy && "copy", s.retry && "retry", s.undo && "undo", s.live && "live"].filter(Boolean).join(" ");
    if (s.kind === "recording") {
      const lv = s.levels || [];
      bars.forEach((b, i) => {
        const v = lv[lv.length - bars.length + i] || 0;
        b.style.height = 4 + Math.min(1, Math.pow(v / 0.08, 0.6)) * 20 + "px";
      });
      $("text").textContent = s.live || "";
    }
    if (s.kind === "text") {
      $("text").textContent = s.hint ? s.text + " · " + s.hint : s.text;
      $("text").title = s.text || "";
    }
  });
</script>
