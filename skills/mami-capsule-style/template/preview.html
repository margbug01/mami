<!doctype html>
<meta charset="utf-8">
<title>Mami 胶囊预览</title>
<!--
  预览台：按 manifest.json 的尺寸把 index.html 放进一个框，像真的贴在桌面底部一样。
  要用本地服务器打开（file:// 下浏览器不让读 manifest、也不让控制框里的页面）：
    cd 这个样式文件夹 && python -m http.server 8765   然后开 http://localhost:8765/preview.html
  Mami 只加载 index.html，这个文件放在样式文件夹里不影响使用。
-->
<style>
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: 1fr auto; font: 13px system-ui, "Microsoft YaHei UI", sans-serif;
    background: radial-gradient(circle at 30% 20%, #3b4a7a, #141826 70%); color: #e8e8ee; }
  body.light { background: radial-gradient(circle at 30% 20%, #e9eefc, #b9c3d9 70%); }
  #desk { position: relative; overflow: hidden; }
  #frame { position: absolute; border: 0; background: transparent; outline: 1px dashed rgba(255, 255, 255, .25); }
  #hits { position: absolute; pointer-events: none; }
  #hits div { position: absolute; outline: 1px dashed #ff3b6b; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; background: rgba(0, 0, 0, .55); }
  button, select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #555; background: #262a36; color: inherit; cursor: pointer; }
  button.on { background: #4d7cff; border-color: #4d7cff; }
  #log { margin-left: auto; opacity: .75; font-family: ui-monospace, Consolas, monospace; }
</style>
<div id="desk"><iframe id="frame" src="index.html"></iframe><div id="hits"></div></div>
<div id="bar">
  <button data-k="auto" class="on">自动循环</button>
  <button data-k="recording">录音</button>
  <button data-k="live">录音+实时字</button>
  <button data-k="recognizing">识别中</button>
  <button data-k="text">结果(可复制)</button>
  <button data-k="hint">提示</button>
  <button data-k="retry">失败可重试</button>
  <button data-k="undo">可撤销</button>
  <button data-k="hidden">收起</button>
  <select id="tone"><option>dark</option><option>light</option><option>auto</option></select>
  <label><input type="checkbox" id="showHits" checked> 可点区域</label>
  <span id="log">点胶囊上的按钮，这里显示动作</span>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const frame = $("#frame"), desk = $("#desk");
  let man = { width: 260, height: 110, position: "bottom", offsetX: 0, offsetY: 0 };
  let emit = null, mode = "auto", t0 = performance.now();
  const sample = "帮我把这个接口改成用 Go 写，然后四点开会。";

  function place() {
    const W = desk.clientWidth, H = desk.clientHeight;
    let x = (W - man.width) / 2, y = H - man.height - 4;
    if (man.position === "top") y = 4;
    if (man.position === "center") y = (H - man.height) / 2;
    x += man.offsetX || 0; y += man.offsetY || 0;
    Object.assign(frame.style, { left: x + "px", top: y + "px", width: man.width + "px", height: man.height + "px" });
    Object.assign($("#hits").style, { left: x + "px", top: y + "px" });
  }
  fetch("manifest.json").then((r) => r.ok ? r.json() : {}).catch(() => ({})).then((m) => { man = { ...man, ...m }; place(); });
  addEventListener("resize", place);

  window.__mamiPreview = {
    attach(fn) { emit = fn; },
    onAction(name) {
      $("#log").textContent = "action: " + name;
      if (name === "stop") pick("recognizing");
      if (name === "cancel" || name === "close" || name === "copy") pick("hidden");
      if (name === "retry") pick("recognizing");
    },
  };
  function state(kind, t) {
    const tone = $("#tone").value, s = { kind, level: 0, tone };
    if (kind === "recording" || kind === "live") {
      s.kind = "recording";
      s.levels = Array.from({ length: 48 }, (_, i) => { const x = t - (47 - i) * 0.05; return x % 6 > 1.6 && x % 6 < 2.2 ? 0.002 : 0.06 * Math.abs(Math.sin(x * 3) + 0.6 * Math.sin(x * 7.3)); });
      s.level = Math.min(1, Math.pow(s.levels[47] / 0.08, 0.6));
      if (kind === "live") s.live = sample.slice(0, Math.max(0, Math.floor((t % 6) * 8)));
    }
    if (kind === "text") Object.assign(s, { text: sample, copy: true });
    if (kind === "hint") Object.assign(s, { kind: "text", text: sample, hint: "润色失败，保留原话" });
    if (kind === "retry") Object.assign(s, { kind: "text", text: "识别未完成", retry: true });
    if (kind === "undo") Object.assign(s, { kind: "text", text: "已按你说的改写", undo: true });
    return s;
  }
  function pick(k) {
    mode = k; t0 = performance.now();
    document.querySelectorAll("#bar button").forEach((b) => b.classList.toggle("on", b.dataset.k === k));
  }
  document.querySelectorAll("#bar button").forEach((b) => (b.onclick = () => pick(b.dataset.k)));
  $("#tone").onchange = () => document.body.classList.toggle("light", $("#tone").value === "light");
  setInterval(() => {
    if (!emit) return;
    const t = (performance.now() - t0) / 1000;
    if (mode !== "auto") return emit(state(mode, t));
    const c = t % 9;
    emit(state(c < 4.5 ? "recording" : c < 5.7 ? "recognizing" : c < 8.4 ? "text" : "hidden", c));
  }, 50);
  (function drawHits() {
    const box = $("#hits"); box.innerHTML = "";
    try {
      if ($("#showHits").checked) frame.contentDocument.querySelectorAll("[data-mami-hit]").forEach((el) => {
        const b = el.getBoundingClientRect(), d = document.createElement("div");
        Object.assign(d.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
        box.appendChild(d);
      });
    } catch (e) {}
    requestAnimationFrame(drawHits);
  })();
</script>
